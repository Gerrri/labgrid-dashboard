# Labgrid Dashboard - Docker Compose Configuration
# Development environment with Labgrid Coordinator, Backend, and Frontend
#
# Profiles:
#   - default (no profile): Runs coordinator, backend, frontend
#   - staging: Adds 4 DUTs and exporters for realistic testing

services:
  # =============================================================================
  # Core Services (always running)
  # =============================================================================

  # Labgrid Coordinator - WAMP router for Labgrid communication
  coordinator:
    build:
      context: ./docker/coordinator
      dockerfile: Dockerfile
    container_name: labgrid-coordinator
    ports:
      - "20408:20408"
    networks:
      - labgrid-network
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s=socket.socket(); s.connect(('localhost', 20408)); s.close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # FastAPI Backend - REST API and WebSocket server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labgrid-backend
    ports:
      - "8000:8000"
    environment:
      - COORDINATOR_URL=ws://coordinator:20408
      - COORDINATOR_REALM=realm1
      - COORDINATOR_TIMEOUT=30
      - PYTHONUNBUFFERED=1
      - EXPORTER_SSH_BUNDLES_DIR=/app/exporter-ssh
      - EXPORTER_2_SSH_PASSWORD=exporter-2-password
      - EXPORTER_4_SSH_PASSWORD=exporter-4-password
      - EXPORTER_3_DUT_SSH_KEYFILE=/root/.ssh/labgrid-dashboard/keys/exporter-3
    depends_on:
      coordinator:
        condition: service_healthy
    networks:
      - labgrid-network
    volumes:
      - ./docker/staging/exporter-ssh:/app/exporter-ssh:ro
      - ./docker/staging/dut-ssh:/app/dut-ssh:ro
    restart: unless-stopped

  # React Frontend - Development server with Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: labgrid-frontend
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=/api
      - VITE_WS_URL=/api/ws
      - VITE_API_PROXY_TARGET=http://backend:8000
      - VITE_HMR_HOST=localhost
      - VITE_HMR_CLIENT_PORT=3000
      - VITE_HMR_PROTOCOL=ws
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - labgrid-network
    restart: unless-stopped

  # =============================================================================
  # Staging Profile: DUT Containers (simulated devices)
  # =============================================================================

  # DUT 1 - Simulated device with serial-over-TCP
  dut-1:
    build:
      context: ./docker/dut
      dockerfile: Dockerfile
    container_name: labgrid-dut-1
    hostname: dut-1
    profiles: ["staging"]
    environment:
      - DUT_NAME=dut-1
    networks:
      - labgrid-network
    restart: unless-stopped

  # DUT 2 - Simulated device with serial-over-TCP
  dut-2:
    build:
      context: ./docker/dut
      dockerfile: Dockerfile
    container_name: labgrid-dut-2
    hostname: dut-2
    profiles: ["staging"]
    environment:
      - DUT_NAME=dut-2
    networks:
      - labgrid-network
    restart: unless-stopped

  # DUT 3 - Simulated device with serial-over-TCP
  dut-3:
    build:
      context: ./docker/dut
      dockerfile: Dockerfile
    container_name: labgrid-dut-3
    hostname: dut-3
    profiles: ["staging"]
    environment:
      - DUT_NAME=dut-3
      - DUT_SSH_AUTH_MODE=private_key
      - DUT_SSH_SERVER_DIR=/ssh-server
    networks:
      - labgrid-network
    volumes:
      - ./docker/staging/dut-server/exporter-3:/ssh-server:ro
    restart: unless-stopped

  # DUT 4 - Simulated device with serial-over-TCP
  dut-4:
    build:
      context: ./docker/dut
      dockerfile: Dockerfile
    container_name: labgrid-dut-4
    hostname: dut-4
    profiles: ["staging"]
    environment:
      - DUT_NAME=dut-4
      - DUT_SSH_AUTH_MODE=password
      - DUT_SSH_PASSWORD=labgrid
    networks:
      - labgrid-network
    restart: unless-stopped

  # =============================================================================
  # Staging Profile: Labgrid Exporters
  # =============================================================================

  # Exporter 1 - Exports DUT-1 to Labgrid Coordinator
  exporter-1:
    build:
      context: ./docker/exporter
      dockerfile: Dockerfile
    container_name: labgrid-exporter-1
    hostname: exporter-1
    profiles: ["staging"]
    environment:
      - DUT_HOST=dut-1
      - DUT_PORT=5000
      - EXPORTER_NAME=exporter-1
      - COORDINATOR_URL=ws://coordinator:20408/ws
      - EXPORTER_ISOLATED=1
      - EXPORTER_HOSTNAME=exporter-1
      - EXPORTER_SSH_AUTH_MODE=private_key
    depends_on:
      - dut-1
      - coordinator
    networks:
      - labgrid-network
    volumes:
      - ./docker/staging/exporter-server/exporter-1:/ssh-server:ro
    restart: unless-stopped

  # Exporter 2 - Exports DUT-2 to Labgrid Coordinator with password auth
  exporter-2:
    build:
      context: ./docker/exporter
      dockerfile: Dockerfile
    container_name: labgrid-exporter-2
    hostname: exporter-2
    profiles: ["staging"]
    environment:
      - DUT_HOST=dut-2
      - DUT_PORT=5000
      - SERIAL_PORT=5999
      - EXPORTER_NAME=exporter-2
      - COORDINATOR_URL=ws://coordinator:20408/ws
      - EXPORTER_ISOLATED=1
      - EXPORTER_HOSTNAME=exporter-2
      - EXPORTER_SSH_AUTH_MODE=password
      - EXPORTER_SSH_PASSWORD=exporter-2-password
    depends_on:
      - dut-2
      - coordinator
    networks:
      - labgrid-network
    volumes:
      - ./docker/staging/exporter-server/exporter-2:/ssh-server:ro
    restart: unless-stopped

  # Exporter 3 - Exports DUT-3 to Labgrid Coordinator with key auth
  exporter-3:
    build:
      context: ./docker/exporter
      dockerfile: Dockerfile
    container_name: labgrid-exporter-3
    hostname: exporter-3
    profiles: ["staging"]
    environment:
      - DUT_HOST=dut-3
      - DUT_PORT=5000
      - SSH_PASSWORD=
      - EXPORTER_NAME=exporter-3
      - COORDINATOR_URL=ws://coordinator:20408/ws
      - EXPORTER_ISOLATED=1
      - EXPORTER_HOSTNAME=exporter-3
      - EXPORTER_SSH_AUTH_MODE=private_key
      - EXPORTER_SSH_SERVER_DIR=/ssh-server
    depends_on:
      - dut-3
      - coordinator
    networks:
      - labgrid-network
    volumes:
      - ./docker/staging/exporter-server/exporter-3:/ssh-server:ro
    restart: unless-stopped

  # Exporter 4 - Exports DUT-4 to Labgrid Coordinator with password auth
  exporter-4:
    build:
      context: ./docker/exporter
      dockerfile: Dockerfile
    container_name: labgrid-exporter-4
    hostname: exporter-4
    profiles: ["staging"]
    environment:
      - DUT_HOST=dut-4
      - DUT_PORT=5000
      - EXPORTER_NAME=exporter-4
      - COORDINATOR_URL=ws://coordinator:20408/ws
      - EXPORTER_ISOLATED=1
      - EXPORTER_HOSTNAME=exporter-4
      - EXPORTER_SSH_AUTH_MODE=password
      - EXPORTER_SSH_PASSWORD=exporter-4-password
    depends_on:
      - dut-4
      - coordinator
    networks:
      - labgrid-network
    volumes:
      - ./docker/staging/exporter-server/exporter-4:/ssh-server:ro
    restart: unless-stopped

  # =============================================================================
  # Staging Profile: Init Container for Place Setup
  # =============================================================================

  # Init-Places - Creates all exporter places without acquiring any of them
  init-places:
    build:
      context: ./docker/init-acquire
      dockerfile: Dockerfile
    container_name: labgrid-init-places
    profiles: ["staging"]
    environment:
      # Coordinator connection (host:port format for labgrid-client)
      - COORDINATOR_HOST=coordinator:20408
      # Leave empty to avoid acquiring any place by default
      - ACQUIRE_PLACE=none
      # Username used for labgrid-client operations
      - USER_NAME=staging-user
      # Wait time for services to initialize
      - WAIT_TIME=15
    depends_on:
      coordinator:
        condition: service_healthy
      exporter-1:
        condition: service_started
      exporter-2:
        condition: service_started
      exporter-3:
        condition: service_started
      exporter-4:
        condition: service_started
    networks:
      - labgrid-network
    # Restart policy: no (runs once then exits)
    restart: "no"

networks:
  labgrid-network:
    driver: bridge
    name: labgrid-network
