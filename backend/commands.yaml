# Labgrid Dashboard - Predefined Commands Configuration
#
# This file defines command presets that can be assigned to targets.
# Each preset contains a set of commands, scheduled commands, and auto-refresh settings.

# Default preset for new targets (fallback when no assignment exists)
default_preset: basic

# Preset definitions
presets:
  basic:
    name: "Basic"
    description: "Standard Linux Commands"
    command_execution:
      transport_order:
        - serial
        - ssh
      serial:
        prompt: ".*[#\\$] "
        login_prompt: "(?i)login: ?"
        username: "root"
    commands:
      - name: "Linux Version"
        command: "cat /etc/os-release"
        description: "Shows the Linux distribution"

      - name: "System Time"
        command: "date"
        description: "Current system time"

      - name: "Kernel Version"
        command: "uname -a"
        description: "Kernel and system info"

      - name: "Uptime"
        command: "uptime"
        description: "System uptime"

      - name: "Disk Usage"
        command: "df -h"
        description: "Disk usage information"

      - name: "Memory Info"
        command: "free -h"
        description: "Memory usage information"

      - name: "Network Interfaces"
        command: "ip addr"
        description: "Network interface configuration"

      - name: "Process List"
        command: "ps aux --sort=-%mem | head -20"
        description: "Top 20 processes by memory usage"

    auto_refresh_commands:
      - "Linux Version"
      - "System Time"
      - "Uptime"

    scheduled_commands:
      - name: "Uptime"
        command: "uptime -p"
        interval_seconds: 180
        description: "System uptime (updates every 3 minutes)"

      - name: "Load"
        command: "cat /proc/loadavg | cut -d' ' -f1-3"
        interval_seconds: 180
        description: "System load average (updates every 3 minutes)"

      - name: "Memory"
        command: "free -h | grep Mem | awk '{print $3\"/\"$2}'"
        interval_seconds: 180
        description: "Memory usage (updates every 3 minutes)"

  hardware1:
    name: "Hardware 1"
    description: "Commands for specialized hardware"
    commands:
      - name: "GPIO Status"
        command: "cat /sys/class/gpio/export 2>/dev/null || echo 'GPIO not available'"
        description: "GPIO Pin Status"

      - name: "I2C Devices"
        command: "i2cdetect -y 1 2>/dev/null || echo 'I2C not available'"
        description: "I2C Bus Scan"

      - name: "Temperature"
        command: "cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null || echo 'N/A'"
        description: "CPU Temperature (millidegrees)"

      - name: "CPU Info"
        command: "cat /proc/cpuinfo | grep -E '(model name|Hardware|Revision)' | head -5"
        description: "CPU/Hardware information"

      - name: "USB Devices"
        command: "lsusb"
        description: "List USB devices"

      - name: "Kernel Messages"
        command: "dmesg | tail -20"
        description: "Last 20 kernel messages"

    auto_refresh_commands:
      - "GPIO Status"
      - "Temperature"

    scheduled_commands:
      - name: "Temperature"
        command: "cat /sys/class/thermal/thermal_zone0/temp 2>/dev/null || echo 'N/A'"
        interval_seconds: 180
        description: "CPU Temperature monitoring (updates every 3 minutes)"

      - name: "Load"
        command: "cat /proc/loadavg | cut -d' ' -f1-3"
        interval_seconds: 180
        description: "System load average (updates every 3 minutes)"

  staging_serial_only:
    name: "Staging Serial Only"
    description: "Staging preset that executes commands only over the serial console"
    command_execution:
      transport_order:
        - serial
      serial:
        prompt: ".*[#\\$] "
        login_prompt: "(?i)login: ?"
        username: "root"
        password: "labgrid"
    commands:
      - name: "Linux Version"
        command: "cat /etc/os-release"
        description: "Shows the Linux distribution"
      - name: "System Time"
        command: "date"
        description: "Current system time"
    scheduled_commands:
      - name: "Uptime"
        command: "uptime -p"
        interval_seconds: 180
        description: "System uptime (updates every 3 minutes)"

  staging_serial_fallback:
    name: "Staging Serial With SSH Fallback"
    description: "Staging preset that tries serial first and falls back to SSH"
    command_execution:
      transport_order:
        - serial
        - ssh
      serial:
        login_prompt: "(?i)login: ?"
        username: "root"
        password: "labgrid"
        prompt: ".*[#\\$] "
    commands:
      - name: "Linux Version"
        command: "cat /etc/os-release"
        description: "Shows the Linux distribution"
      - name: "System Time"
        command: "date"
        description: "Current system time"
    scheduled_commands:
      - name: "Uptime"
        command: "uptime -p"
        interval_seconds: 180
        description: "System uptime (updates every 3 minutes)"

  staging_ssh_key:
    name: "Staging SSH With Key"
    description: "Staging preset that executes commands over SSH using a private key"
    command_execution:
      transport_order:
        - ssh
      ssh:
        keyfile_env: "EXPORTER_3_DUT_SSH_KEYFILE"
    commands:
      - name: "Linux Version"
        command: "cat /etc/os-release"
        description: "Shows the Linux distribution"
      - name: "System Time"
        command: "date"
        description: "Current system time"
    scheduled_commands:
      - name: "Uptime"
        command: "uptime -p"
        interval_seconds: 180
        description: "System uptime (updates every 3 minutes)"

  staging_ssh_password:
    name: "Staging SSH With Password"
    description: "Staging preset that executes commands over SSH using username/password"
    command_execution:
      transport_order:
        - ssh
    commands:
      - name: "Linux Version"
        command: "cat /etc/os-release"
        description: "Shows the Linux distribution"
      - name: "System Time"
        command: "date"
        description: "Current system time"
    scheduled_commands:
      - name: "Uptime"
        command: "uptime -p"
        interval_seconds: 180
        description: "System uptime (updates every 3 minutes)"
